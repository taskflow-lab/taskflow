[pytest]
testpaths = tests
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning

markers =
    unit: fast tests of one function in isolation
    integration: tests of several modules working together
    contract: API response shape checks
    api: full API request/response tests
    smoke: quick "is the app alive" checks
    health: /health and /ready checks
    regression: full end-to-end regression scenarios
    ui: browser tests with Playwright
    auth: tests for the auth module
    projects: tests for the projects module
    issues: tests for the issues module
    sprints: tests for the sprints module
    board: tests for the board module
    search: tests for the search module
    notifications: tests for the notifications module
    billing: tests for the billing module
