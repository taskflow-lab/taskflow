{% extends "layouts/base.html" %}

{% block title %}{{ code }}{% endblock %}

{% block content %}
<section class="error-page" data-testid="error-page">
  <p class="error-code">{{ code }}</p>
  <h1>{{ message }}</h1>
  <a class="btn btn-primary" href="{{ url_for('index') }}">Back to home</a>
</section>
{% endblock %}

{% block auth_content %}
<section class="auth-card error-page" data-testid="error-page">
  <p class="error-code">{{ code }}</p>
  <h1>{{ message }}</h1>
  <a class="btn btn-primary" href="{{ url_for('index') }}">Back to home</a>
</section>
{% endblock %}
